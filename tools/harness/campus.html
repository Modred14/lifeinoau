<!-- tools/harness/campus.html : renders the real-footprint campus (lib3d/campusReal.js). Serve the project root plus /three and /data. -->
<!doctype html><html><body style="margin:0;background:#0a1120"><div id="stage" style="width:100vw;height:100vh"></div>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import {createStage} from "/lib3d/stage.js"; import {buildRealCampus,addRealLighting} from "/lib3d/campusReal.js";
const data=await (await fetch("/data/oau-campus.json")).json();
const st=createStage(document.getElementById("stage"),{fov:42,far:1800,controls:{maxPolarAngle:1.38,minDistance:10,maxDistance:520}});
const light=addRealLighting(st.scene); const campus=buildRealCampus(data); st.scene.add(campus.root); st.onFrame((t)=>{campus.update(t);light.follow(st.controls.target)});
window.view=(tx,tz,dist,az,pol)=>{ st.controls.target.set(tx,0,tz); st.camera.position.set(tx+Math.sin(az)*Math.sin(pol)*dist, Math.cos(pol)*dist, tz+Math.cos(az)*Math.sin(pol)*dist); st.controls.update(); st.renderer.render(st.scene,st.camera); window.__ready=true; };
window.sel=(id)=>campus.setSelected(id);
</script></body></html>
