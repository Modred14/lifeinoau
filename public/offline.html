<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline | lifeinoau</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        background: #0d1321;
        color: #eaf0f8;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
        background-image:
          radial-gradient(
            50% 38% at 50% 28%,
            rgba(251, 173, 1, 0.09),
            transparent 70%
          ),
          radial-gradient(
            70% 40% at 50% 108%,
            rgba(21, 128, 61, 0.2),
            transparent 70%
          );
      }
      main {
        max-width: 460px;
      }
      img {
        width: 120px;
        height: 120px;
        opacity: 0.55;
        filter: saturate(0.6);
        margin-bottom: 18px;
      }
      .chip {
        display: inline-block;
        margin: 0 0 14px;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #f2b84b;
        background: rgba(242, 184, 75, 0.09);
        border: 1px solid rgba(242, 184, 75, 0.22);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.8rem;
      }
      p {
        margin: 0 0 24px;
        color: #b8c3d6;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 700;
        border: 0;
        border-radius: 14px;
        padding: 14px 28px;
        background: #15803d;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="" />
      <p class="chip">No connection</p>
      <h1>You are offline</h1>
      <p>
        We can't reach lifeinoau right now. Check your Wi-Fi or mobile data,
        then try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
